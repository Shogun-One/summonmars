<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summon Mars</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="url-logo.png" />

  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* --- SECURITY LOCKDOWN PROTOCOLS --- */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    img {
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* THE VAULT: Video Container Styling */
    .video-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      width: 100%;
      box-shadow: 0 0 50px rgba(0, 195, 255, 0.15);
      -webkit-tap-highlight-color: transparent;
    }

    /* FULLSCREEN FIX */
    .video-wrapper:fullscreen,
    .video-wrapper:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    
    .video-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }

    /* SMART GHOST CONTROLS */
    .custom-controls {
      position: absolute;
      bottom: 20px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 1rem;
      align-items: center;
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.4s ease;
      background: rgba(0, 0, 0, 0.7);
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-wrapper.user-active .custom-controls,
    .video-wrapper.paused .custom-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .control-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .control-btn:hover { transform: scale(1.15); }
    .control-btn svg { width: 100%; height: 100%; fill: currentColor; }

    /* RESET & THEME */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --aurora-1: #77ffef; --aurora-2: #7cff5f; --aurora-3: #ff66ff;
      --aurora-4: #00c3ff; --bg-deep: #02030a; --text-main: #fdfdfd;
      --text-sub: #cfd9ff; --accent: #fffd9a;
    }

    body {
      font-family: "Oswald", sans-serif;
      background: radial-gradient(circle at 10% 0%, #05091a 0%, #000000 60%, #02030a 100%);
      color: var(--text-main);
      min-height: 100vh;
      scroll-behavior: smooth;
      background-attachment: fixed;
    }

    /* --- BACKGROUND ANIMATIONS --- */
    .stars-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: -11;
      background: radial-gradient(2.5px 2.5px at 8% 10%, #fff 0, transparent 60%),
                  radial-gradient(2px 2px at 20% 30%, #dcebff 0, transparent 60%),
                  radial-gradient(2.5px 2.5px at 80% 18%, #fff 0, transparent 60%);
      animation: star-ascend 30s linear infinite;
    }
    @keyframes star-ascend { 0% { transform: translateY(40px); } 100% { transform: translateY(-160px); } }
    .aurora-layer { position: fixed; inset: 0; pointer-events: none; z-index: -10; opacity: 0.5; filter: blur(5px);
      background: radial-gradient(circle at 15% 0%, rgba(119,255,239,0.25) 0, transparent 55%);
    }

    /* HERO & NAV */
    .hero { position: relative; min-height: 60vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1.5rem; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; background-image: url("astronaut-banner.jpeg"); background-size: cover; z-index: -2; filter: brightness(1.2); }
    .main-nav { display: flex; gap: 2.5rem; letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 2rem; }
    .main-nav a { text-decoration: none; color: #fff; font-weight: 600; }
    .logo { font-family: "Black Ops One"; font-size: clamp(3rem, 7vw, 5.5rem); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 4rem; text-shadow: 0 0 15px rgba(255,255,255,0.2); }

    /* LAYOUT CENTERED */
    main { position: relative; max-width: 1100px; width: 100%; margin: 0 auto; padding: 2rem; }
    section { padding: 3rem 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
    .embed-grid, .gif-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 2rem; 
      justify-items: center; 
      margin-top: 2rem;
    }

    .store-strip { margin: 1.5rem auto; padding: 0.5rem; background: rgba(0,0,0,0.7); border-radius: 999px; max-width: 900px; }
    .store-strip img { width: 100%; height: auto; display: block; }

    /* MOBILE TWEAKS */
    @media (max-width: 768px) {
      .embed-grid, .gif-grid { grid-template-columns: 1fr; }
      .logo { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <div class="stars-layer"></div>
  <div class="aurora-layer"></div>

  <header class="hero">
    <nav class="main-nav">
      <a href="#music">Music</a>
      <a href="#videos">Videos</a>
      <a href="#merch">Merch</a>
      <a href="#about">About</a>
    </nav>
    <h1 class="logo">Summon Mars</h1>
    <p style="letter-spacing: 0.2em; text-transform: uppercase; margin-top: 1rem;">Signal from the other side</p>
  </header>

  <div class="store-strip">
    <img src="all-stores.png" alt="Platforms" />
  </div>

  <main>
    <section id="music">
      <h2 style="color: var(--accent); letter-spacing: 0.3em; text-transform: uppercase;">Transmissions</h2>
      <div class="embed-grid">
        <div class="embed-wrapper" data-audio-id="track-life">
          <div class="embed-inner">
            <img src="cover-life-that-moves.png" style="width:100%">
            <div style="padding:1rem; text-align:left;">
              <p>Life That Moves</p>
              <button class="track-play">▶</button>
              <audio id="track-life" src="life-that-moves.mp3"></audio>
            </div>
          </div>
        </div>
        </div>
    </section>

    <section id="videos">
      <h2 style="color: var(--accent); letter-spacing: 0.3em; text-transform: uppercase;">Visuals</h2>
      <div style="max-width: 800px; margin: 2rem auto;">
        <div class="video-wrapper hero-video paused">
          <video data-vid="racetomarsforsite.mp4" poster="racetomars-vidpic1.png" playsinline></video>
          <div class="custom-controls">
            <button class="control-btn btn-rewind"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
            <button class="control-btn btn-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="control-btn btn-forward"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
            <button class="control-btn btn-mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
            <button class="control-btn btn-fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
          </div>
        </div>
      </div>

      <p style="margin-top: 2rem;">
        <a href="videos.html" style="color: var(--accent); text-decoration: underline; font-weight: bold;">Click HERE for more music videos.</a>
      </p>
    </section>
  </main>

  <footer style="text-align:center; padding: 4rem; opacity: 0.4; font-size: 0.8rem;">
    © 2026 Summon Mars. Secure Signal Active.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      /* CONSOLE TRAP */
      setInterval(() => { console.clear(); console.log("%cSummon Mars Security Active", "color:red; font-size:20px;"); }, 2000);

      /* SOURCE INJECTION */
      document.querySelectorAll('video[data-vid]').forEach(v => { v.src = v.getAttribute('data-vid'); v.load(); });

      /* VIDEO LOGIC */
      const wrappers = document.querySelectorAll('.video-wrapper');
      wrappers.forEach(wrapper => {
        const video = wrapper.querySelector('video');
        const playBtn = wrapper.querySelector('.btn-play');
        const muteBtn = wrapper.querySelector('.btn-mute');
        const rewindBtn = wrapper.querySelector('.btn-rewind');
        const forwardBtn = wrapper.querySelector('.btn-forward');
        const fullBtn = wrapper.querySelector('.btn-fullscreen');
        
        let hideTimeout;
        const wake = () => {
          wrapper.classList.add('user-active');
          clearTimeout(hideTimeout);
          if (!video.paused) hideTimeout = setTimeout(() => wrapper.classList.remove('user-active'), 2500);
        };

        wrapper.addEventListener('mousemove', wake);
        wrapper.addEventListener('touchstart', wake);

        playBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (video.paused) { video.play(); wrapper.classList.remove('paused'); }
          else { video.pause(); wrapper.classList.add('paused'); }
          wake();
        });

        muteBtn.addEventListener('click', (e) => { e.stopPropagation(); video.muted = !video.muted; wake(); });
        rewindBtn.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime -= 10; wake(); });
        forwardBtn.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime += 10; wake(); });
        fullBtn.addEventListener('click', (e) => { e.stopPropagation(); wrapper.requestFullscreen(); wake(); });
      });

      /* AUDIO LOGIC */
      const buttons = document.querySelectorAll('.track-play');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const audio = btn.nextElementSibling;
          if (audio.paused) { audio.play(); btn.textContent = '⏸'; }
          else { audio.pause(); btn.textContent = '▶'; }
        });
      });
    });
  </script>
</body>
</html>
