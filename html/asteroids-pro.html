<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Asteroid Drift - Summon Mars Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#05030b;
      --bg2:#140b2a;
      --accent:#ff3b82;
      --accent-soft:#ff8ac0;
      --hud:#e4e4ff;
      --danger:#ff2a2a;
      --purple:#8a2be2;
      --bassKick:0;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding-top: 18px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      color:var(--hud);
      overflow:hidden;
    }

    #bgfx{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:0;
      pointer-events:none;
    }

    #impactFx{
      position:fixed;
      inset:0;
      z-index:1; 
      pointer-events:none;
      opacity:0;
      transition: opacity 140ms ease;
      mix-blend-mode: screen;
      background-repeat:no-repeat;
      background-position:center;
      background-size:cover;
      filter: drop-shadow(0 0 18px rgba(255,59,130,.12));
    }
    #impactFx.active{ opacity:1; }
    #impactFx.glass{
      background-image:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.10), rgba(0,0,0,0) 55%),
        url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%201200%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba(255%2C231%2C255%2C0.32)%27%20stroke-width%3D%273.2%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M600%20620%20L80%20120%27/%3E%3Cpath%20d%3D%27M600%20620%20L1120%20120%27/%3E%3Cpath%20d%3D%27M600%20620%20L90%201090%27/%3E%3Cpath%20d%3D%27M600%20620%20L1110%201090%27/%3E%3Cpath%20d%3D%27M600%20620%20L600%20-40%27/%3E%3Cpath%20d%3D%27M600%20620%20L600%201240%27/%3E%3Cpath%20d%3D%27M600%20620%20L-40%20620%27/%3E%3Cpath%20d%3D%27M600%20620%20L1240%20620%27/%3E%3Cpath%20d%3D%27M600%20620%20C520%20560%20450%20520%20400%20450%27/%3E%3Cpath%20d%3D%27M600%20620%20C680%20560%20760%20510%20820%20430%27/%3E%3Cpath%20d%3D%27M600%20620%20C520%20690%20450%20760%20370%20810%27/%3E%3Cpath%20d%3D%27M600%20620%20C680%20690%20740%20780%20820%20840%27/%3E%3C/g%3E%3C/svg%3E");
    }
    #impactFx.boomflash{
      background-image: radial-gradient(circle at 50% 45%, rgba(255,59,130,.22), rgba(0,0,0,0) 60%);
      mix-blend-mode: screen;
    }

    .wrapper{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:.5rem;
      padding:.8rem;
      width:min(520px, 100vw);
    }

    h1{
      margin:0;
      font-family:'Audiowide','Orbitron', system-ui, sans-serif;
      font-size:1.65rem;
      letter-spacing:.20em;
      text-transform:uppercase;
      text-align:center;
      background:linear-gradient(180deg, rgba(255,231,255,0.98), rgba(255,138,192,0.92), rgba(138,43,226,0.86));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:
        0 0 18px rgba(255,59,130,.20),
        0 0 28px rgba(138,43,226,.16);
    }

    .subtitle{
      font-size:.8rem;
      opacity:.8;
      text-align:center;
      max-width:420px;
    }

    .controls{
      font-size:.82rem;
      opacity:.9;
      text-align:center;
      line-height:1.35;
      max-width:460px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:.45rem;
    }

    .hud{
      display:flex;
      justify-content:space-between;
      width:100%;
      max-width:480px;
      font-size:.85rem;
      opacity:.92;
      margin-top:.15rem;
      gap:.6rem;
      flex-wrap:wrap;
    }

    .hud .pill{
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,138,192,.18);
      border-radius:999px;
      padding:.28rem .6rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .hud span{
      color:rgba(255,231,255,0.98);
      font-weight:800;
      font-family:'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      text-shadow:0 0 10px rgba(255,138,192,.22);
    }

    .game-shell{
      position:relative;
      width:100%;
      display:flex;
      justify-content:center;
      margin-top:.4rem;
    }

    canvas#game{
      border-radius:18px;
      background:
        radial-gradient(circle at top, #1a1638, #05020a),
        repeating-radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
      box-shadow:0 0 25px rgba(0,0,0,.8), 0 0 26px rgba(255,59,130,.45);
      touch-action:none;
      max-width:100vw;
      height:auto;
      display:block;
      position:relative;
      z-index:2;
    }

    .bubble-btn{
      position: fixed;
      bottom: 22px;
      width: 80px;
      height: 80px;
      border-radius: 999px;
      border: 1px solid rgba(255,231,255,.22);
      background: radial-gradient(circle at 30% 30%,
        rgba(255,255,255,.10),
        rgba(255,138,192,.06) 55%,
        rgba(0,0,0,.22));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 18px rgba(255,59,130,.20);
      cursor: pointer;
      display: grid;
      place-items: center;
      user-select: none;
      z-index: 10000;
      padding: 0;
    }
    .bubble-btn:hover{ filter:brightness(1.08); }
    .bubble-btn:active{ transform:translateY(1px); }

    .bubble-btn .ring.flip{
      position:relative;
      width:100%;
      height:100%;
      border-radius:999px;
      overflow:hidden;
      perspective:700px;
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.35),
        inset 0 0 0 10px rgba(0,0,0,.18),
        inset 0 0 18px rgba(0,0,0,.55),
        0 0 18px rgba(255,59,130,.14);
    }

    .bubble-btn .ring.flip .face{
      position:absolute;
      inset:0;
      border-radius:999px;
      backface-visibility:hidden;
      transform-style:preserve-3d;
      transition: transform 320ms ease, opacity 220ms ease;
    }

    .bubble-btn .ring.flip .face.stamp{
      opacity:0.95;
      transform: rotateY(0deg);
      display:grid;
      place-items:center;
      background: rgba(0,0,0,0.08);
    }

    .bubble-btn .ring.flip .face.stamp .stamp-img{
      width:100%;
      height:100%;
      object-fit:contain;
      opacity:0.95;
      filter: drop-shadow(0 0 14px rgba(255,59,130,.18));
      transform: translateZ(1px);
      user-select:none;
      pointer-events:none;
    }

    .bubble-btn .ring.flip .face.woofer{
      opacity:0;
      transform: rotateY(180deg);
      border:1px solid rgba(228,228,255,.22);
      background:
        radial-gradient(circle at 50% 50%,
          rgba(0,0,0,0) 0 36%,
          rgba(0,0,0,.35) 36% 48%,
          rgba(0,0,0,.78) 48% 78%,
          rgba(0,0,0,.96) 78% 100%),
        radial-gradient(circle at 35% 28%,
          rgba(255,255,255,.18),
          rgba(0,0,0,.55) 55%,
          rgba(0,0,0,.92) 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.06),
        inset 0 0 22px rgba(0,0,0,.85);
    }

    body.music-on .bubble-btn .ring.flip .face.stamp{ opacity:0; transform: rotateY(-180deg); }
    body.music-on .bubble-btn .ring.flip .face.woofer{ opacity:1; transform: rotateY(0deg); }

    .bubble-btn .ring.flip .dot-indicator{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:999px;
      right:10px;
      bottom:10px;
      background:rgba(255,138,192,.95);
      box-shadow:0 0 10px rgba(255,138,192,.65);
      opacity:.35;
      transition: opacity .2s ease;
    }
    #musicBtn.on .dot-indicator{ opacity:1; }

    .game-shell .bubble-btn{
      position:absolute;
      bottom:0;
      z-index:6;
      width:74px;
      height:74px;
      transform: translateY(50%);
    }

    .game-shell #reset-btn{ left:25%; transform: translate(-50%, 50%); }
    .game-shell #musicBtn{ left:75%; transform: translate(-50%, 50%); }

    .mini-bubble{
      position:relative;
      width:34px;
      height:34px;
      border-radius:999px;
      border:1px solid rgba(255,138,192,.45);
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.10), rgba(255,59,130,.05) 55%, rgba(0,0,0,.22));
      backdrop-filter: blur(6px);
      box-shadow:0 0 18px rgba(255,59,130,.18);
      cursor:pointer;
      display:grid;
      place-items:center;
    }
    
    .mini-bubble .ring{
      width:22px;height:22px;border-radius:999px;
      border:1px solid rgba(228,228,255,.30);
      display:grid;place-items:center;
      font-family:'Share Tech Mono', monospace;
      font-size:10px;
      color:rgba(255,231,255,0.92);
    }

    .center-controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-top:8px;
    }

    .mini-joystick .stick{
      position:absolute;
      width:18px;
      height:18px;
      border-radius:50%;
      background: rgba(255,138,192,0.85);
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      transition: transform 0.05s linear;
    }

    .security-banner {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ff3b3b;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 59, 59, 0.4);
      border-radius: 999px;
      z-index: 9999;
      white-space: nowrap;
    }

    footer {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.85);
      z-index: 6;
    }
  </style>
</head>

<body>
  <canvas id="bgfx"></canvas>
  <div id="impactFx"></div>
  <div class="security-banner">Protected From Bad Vibes</div>

  <div class="wrapper">
    <h1>ASTEROID DRIFT</h1>
    <div class="subtitle">Neon field. Final bosses. Purple asteroids with loud opinions.</div>
    <div class="controls">\ Thrust: Bottom Joystick, [↑][↓][←][→], or WASD /</div>

    <div class="hud">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Best: <span id="best">0</span></div>
      <div class="pill">Level: <span id="level">1</span></div>
      <div class="pill">Lives: <span id="lives">5</span></div>
      <div class="pill">Hits: <span id="hits">0</span>/<span id="hitsMax">5</span></div>
      <div class="pill">To Next: <span id="toNext">0</span>/<span id="toNextMax">10</span></div>
      <div class="pill">Boss Kills: <span id="bossKills">0</span></div>
      <div class="pill">Diff: <span id="diffLabel">Easy Peasy</span></div>
    </div>

    <div class="game-shell">
      <canvas id="game" width="480" height="640"></canvas>
      
      <button id="reset-btn" class="bubble-btn restart-btn">
        <span class="ring flip">
          <span class="face stamp"><img class="stamp-img" data-asset="images/asteroids/reset-stamp.png"></span>
          <span class="face woofer"></span>
        </span>
      </button>

      <button id="musicBtn" class="bubble-btn music-btn">
        <span class="ring flip">
          <span class="face stamp"><img class="stamp-img" data-asset="images/asteroids/sound-stamp.png"></span>
          <span class="face woofer"></span>
          <span class="dot-indicator"></span>
        </span>
      </button>

      <div class="center-controls">
        <button id="pauseBtn" class="mini-bubble">
          <span class="ring"><span class="icon">II</span></span>
        </button>
        <div id="joystick" class="mini-bubble mini-joystick">
          <div class="stick"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2026 Summon Mars ™. All rights reserved.</footer>

  <script>
    // --- BASIC CONFIG ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const ASSET_ROOT = (location.protocol === 'file:') ? '../' : '/';
    const A = (p) => ASSET_ROOT + String(p).replace(/^\/+/, '');

    // --- GAME STATE ---
    let score = 0, bestScore = Number(localStorage.getItem('asteroidBest') || 0);
    let level = 1, lives = 5, hits = 0, killsThisLevel = 0, bossKills = 0;
    let running = true, paused = false, gameOver = false;
    let preStartTimer = 2200, levelUpTimer = 0, bossIncomingTimer = 0;
    let lastTime = 0, shootCooldown = 0;
    const KILLS_TO_LEVEL = 10, MAX_HITS = 5;

    // --- SHIP ---
    const ship = { x: width/2, y: height/2, radius: 18, vx: 0, vy: 0, angle: 0, invuln: 0, exploding: 0, aimX: 0, aimY: -1 };
    const shipImg = new Image(); shipImg.src = A("images/asteroids/spaceship-player.png");

    // --- JOYSTICK GLOBALS ---
    let joyActive = false, joyVec = { x: 0, y: 0 };
    const DEADZONE = 0.1, JOY_MOVABLE = false;

    // --- COLLECTIONS ---
    let bullets = [], asteroids = [], enemies = [], enemyBullets = [], bosses = [], particles = [], pickups = [];

    // --- DIFFICULTY ---
    const DIFF_PRESETS = [
      { name: "Easy Peasy", mult: 0.78 },
      { name: "Gimme more ammo", mult: 1.0 },
      { name: "Get to the gunners", mult: 1.2 },
      { name: "Bring the pain!", mult: 1.75 }
    ];
    let diffIndex = 0;

    function resetRun(full = false) {
      bullets = []; asteroids = []; enemies = []; enemyBullets = []; bosses = []; particles = []; pickups = [];
      ship.x = width/2; ship.y = height/2; ship.vx = 0; ship.vy = 0;
      if(full) {
        score = 0; level = 1; lives = 5; hits = 0; killsThisLevel = 0;
        document.getElementById('score').textContent = "0";
        document.getElementById('level').textContent = "1";
        document.getElementById('lives').textContent = "5";
      }
      gameOver = false; running = true; preStartTimer = 2200;
    }

    function spawnAsteroid(randomPos = true) {
      const radius = 20 + Math.random() * 25;
      let x, y;
      if(randomPos) {
        x = Math.random() * width;
        y = Math.random() * height;
        if(Math.hypot(x - ship.x, y - ship.y) < 100) return; // safety
      }
      asteroids.push({ x, y, radius, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 });
    }

    function beginLevel(lvl) {
      level = lvl;
      killsThisLevel = 0;
      document.getElementById('level').textContent = lvl;
      document.getElementById('toNext').textContent = "0";
      for(let i=0; i<5; i++) spawnAsteroid();
    }

    // --- INPUTS ---
    window.addEventListener('keydown', e => {
      if(e.code === 'ArrowUp' || e.key === 'w') joyVec.y = -1;
      if(e.code === 'ArrowDown' || e.key === 's') joyVec.y = 1;
      if(e.code === 'ArrowLeft' || e.key === 'a') joyVec.x = -1;
      if(e.code === 'ArrowRight' || e.key === 'd') joyVec.x = 1;
    });
    window.addEventListener('keyup', e => { joyVec.x = 0; joyVec.y = 0; });

    // --- MAIN LOOP ---
    function update(dt) {
      if(paused || gameOver) return;
      if(preStartTimer > 0) { preStartTimer -= dt; return; }

      // Simple Movement
      ship.vx += joyVec.x * 0.5; ship.vy += joyVec.y * 0.5;
      ship.vx *= 0.95; ship.vy *= 0.95;
      ship.x += ship.vx; ship.y += ship.vy;

      // Wrap
      if(ship.x < 0) ship.x = width; if(ship.x > width) ship.x = 0;
      if(ship.y < 0) ship.y = height; if(ship.y > height) ship.y = 0;

      // Asteroids
      asteroids.forEach(a => {
        a.x += a.vx; a.y += a.vy;
        if(a.x < -30) a.x = width + 30; if(a.x > width + 30) a.x = -30;
        if(a.y < -30) a.y = height + 30; if(a.y > height + 30) a.y = -30;
      });
    }

    function draw() {
      ctx.clearRect(0,0,width,height);
      // Ship
      ctx.fillStyle = "white";
      ctx.beginPath(); ctx.arc(ship.x, ship.y, ship.radius, 0, Math.PI*2); ctx.fill();
      // Asteroids
      ctx.strokeStyle = "#ff3b82";
      asteroids.forEach(a => {
        ctx.beginPath(); ctx.arc(a.x, a.y, a.radius, 0, Math.PI*2); ctx.stroke();
      });
      if(preStartTimer > 0) {
        ctx.fillStyle = "white"; ctx.font = "30px Orbitron"; ctx.textAlign = "center";
        ctx.fillText("READY: " + Math.ceil(preStartTimer/1000), width/2, height/2);
      }
    }

    function loop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      update(dt || 16);
      draw();
      requestAnimationFrame(loop);
    }

    // --- START ---
    document.getElementById('reset-btn').onclick = () => resetRun(true);
    resetRun(true);
    beginLevel(1);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
