<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summon Mars Videos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="url-logo.png" />

  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* --- SECURITY LOCKDOWN PROTOCOLS --- */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    img {
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* THE VAULT: Video Container Styling */
    .video-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 0 50px rgba(0, 195, 255, 0.15);
      -webkit-tap-highlight-color: transparent;
      aspect-ratio: 16 / 9; /* Default fallback ratio (most music videos are ~16:9) */
    }

    /* Video element - fills wrapper while preserving original ratio */
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Shows full video with letterbox bars if needed - preserves original rectangle */
      display: block;
      border-radius: 22px;
    }

    /* FULLSCREEN FIX */
    .video-wrapper:fullscreen,
    .video-wrapper:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      aspect-ratio: auto; /* Let fullscreen use native ratio */
    }
    
    /* THE GLASS SHIELD - GHOSTED FOR TOUCH/CONTROLS */
    .video-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      pointer-events: none;
    }

    /* CUSTOM CONTROLS */
    .custom-controls {
      position: absolute;
      bottom: 25px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 0.8rem;
      align-items: center;
      opacity: 0; 
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: rgba(0, 0, 0, 0.75);
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .video-wrapper.user-active .custom-controls,
    .video-wrapper.paused .custom-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .control-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .control-btn:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    .control-btn svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    /* RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* THEME COLORS */
    :root {
      --aurora-1: #77ffef;
      --aurora-2: #7cff5f;
      --aurora-3: #ff66ff;
      --aurora-4: #00c3ff;
      --bg-deep: #02030a;
      --text-main: #fdfdfd;
      --text-sub: #cfd9ff;
      --accent: #fffd9a;
    }

    body {
      font-family: "Oswald", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 10% 0%, #05091a 0%, #000000 60%, #02030a 100%);
      color: var(--text-main);
      min-height: 100vh;
      background-attachment: fixed;
      padding: 2rem 1rem;
    }

    /* CONTAINER FOR MULTIPLE VIDEOS */
    .videos-container {
      display: flex;
      flex-direction: column;
      gap: 5rem;
      align-items: center;
      width: 100%;
    }

    /* VIDEO TITLES */
    .video-title {
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    /* VISIBLE SECURITY BANNER */
    .security-banner {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: red;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      z-index: 100;
      pointer-events: none;
      border: 1px solid red;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }

    /* HIDE NATIVE CONTROLS */
    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-enclosure { display: none !important; }

    /* --- BACKGROUND LAYERS (full styles restored) --- */
    .stars-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -11;
      background:
        radial-gradient(2.5px 2.5px at 8% 10%, rgba(255, 255, 255, 0.95) 0, transparent 60%),
        radial-gradient(2px 2px at 20% 30%, rgba(220, 235, 255, 0.9) 0, transparent 60%),
        radial-gradient(2.5px 2.5px at 35% 15%, rgba(255, 255, 255, 0.95) 0, transparent 60%),
        radial-gradient(2px 2px at 60% 12%, rgba(230, 240, 255, 0.9) 0, transparent 60%),
        radial-gradient(2.5px 2.5px at 80% 18%, rgba(255, 255, 255, 0.95) 0, transparent 60%),
        radial-gradient(2px 2px at 88% 35%, rgba(220, 235, 255, 0.9) 0, transparent 60%),
        radial-gradient(2.5px 2.5px at 72% 52%, rgba(255, 255, 255, 0.95) 0, transparent 60%),
        radial-gradient(2px 2px at 18% 55%, rgba(225, 238, 255, 0.9) 0, transparent 60%),
        radial-gradient(2px 2px at 32% 72%, rgba(230, 240, 255, 0.9) 0, transparent 60%),
        radial-gradient(2.5px 2.5px at 48% 82%, rgba(255, 255, 255, 0.95) 0, transparent 60%),
        radial-gradient(2px 2px at 68% 78%, rgba(220, 235, 255, 0.9) 0, transparent 60%),
        radial-gradient(2.5px 2.5px at 90% 88%, rgba(255, 255, 255, 0.95) 0, transparent 60%);
      opacity: 0.9;
      animation: star-ascend 30s linear infinite;
    }

    .stars-layer::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1.7px 1.7px at 14% 40%, rgba(255, 255, 255, 0.8) 0, transparent 60%),
        radial-gradient(1.7px 1.7px at 55% 25%, rgba(230, 240, 255, 0.8) 0, transparent 60%),
        radial-gradient(1.7px 1.7px at 76% 60%, rgba(255, 255, 255, 0.8) 0, transparent 60%),
        radial-gradient(1.7px 1.7px at 40% 90%, rgba(235, 242, 255, 0.8) 0, transparent 60%);
      opacity: 0.8;
      animation: twinkle-soft 13s ease-in-out infinite alternate;
    }

    @keyframes twinkle-soft {
      0%   { opacity: 0.5; }
      50%  { opacity: 0.9; }
      100% { opacity: 0.6; }
    }

    @keyframes star-ascend {
      0%   { transform: translateY(40px); }
      100% { transform: translateY(-160px); }
    }

    .shooting-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -9;
      overflow: hidden;
    }

    .shooting-stars::before,
    .shooting-stars::after {
      content: "";
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px; 
      height: 2px;
      background: linear-gradient(to left, rgba(255,255,255,0), rgba(255,255,255,0.5), var(--accent));
      filter: drop-shadow(0 0 6px var(--accent));
      transform: rotate(-45deg);
      opacity: 0;
    }

    .shooting-stars::before {
      right: 15%;
      top: -10%;
      animation: shoot-diagonal 12s linear infinite;
      animation-delay: 2s;
    }

    .shooting-stars::after {
      right: 50%;
      top: -10%;
      animation: shoot-diagonal-wide 18s linear infinite;
      animation-delay: 9s; 
    }

    @keyframes shoot-diagonal {
      0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
      5% { transform: translate(-100vw, 100vh) rotate(-45deg); opacity: 0; }
      100% { transform: translate(-100vw, 100vh) rotate(-45deg); opacity: 0; }
    }

    @keyframes shoot-diagonal-wide {
      0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
      7% { transform: translate(-120vw, 120vh) rotate(-45deg); opacity: 0; }
      100% { transform: translate(-120vw, 120vh) rotate(-45deg); opacity: 0; }
    }

    .aurora-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -10;
      background:
        radial-gradient(circle at 15% 0%, rgba(119, 255, 239, 0.25) 0, transparent 55%),
        radial-gradient(circle at 85% 5%, rgba(124, 255, 95, 0.2) 0, transparent 60%),
        radial-gradient(circle at 12% 85%, rgba(255, 102, 255, 0.2) 0, transparent 60%),
        radial-gradient(circle at 90% 80%, rgba(0, 195, 255, 0.25) 0, transparent 60%);
      mix-blend-mode: screen;
      opacity: 0.5;
      filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="stars-layer"></div>
  <div class="shooting-stars"></div>
  <div class="aurora-layer"></div>

  <div class="videos-container">

    <!-- First Video -->
    <div>
      <h2 class="video-title">Race To Mars - Instrumental Variant</h2>
      <div class="video-wrapper paused">
        <video
          data-vid="racetomars.mp4"
          poster="racetomars-vidpic2.png"
          disablepictureinpicture
          oncontextmenu="return false;"
          playsinline
        ></video>
        <div class="custom-controls">
          <button class="control-btn btn-rewind" title="Rewind 10s">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="control-btn btn-play" title="Play">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="control-btn btn-forward" title="Forward 10s">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
          <button class="control-btn btn-mute" title="Mute/Unmute">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <button class="control-btn btn-fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Second Video -->
    <div>
      <h2 class="video-title">Street Knock</h2>
      <div class="video-wrapper paused">
        <video
          data-vid="streetknockvid.mp4"
          poster="streetknockpic.png"
          disablepictureinpicture
          oncontextmenu="return false;"
          playsinline
        ></video>
        <div class="custom-controls">
          <button class="control-btn btn-rewind" title="Rewind 10s">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="control-btn btn-play" title="Play">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="control-btn btn-forward" title="Forward 10s">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
          <button class="control-btn btn-mute" title="Mute/Unmute">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <button class="control-btn btn-fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- VISIBLE DETERRENT BANNER -->
  <div class="security-banner">Summon Mars Security Active – Protected Content</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      /* --- SECURITY LEVEL 1-4 --- */
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.onkeydown = function(e) {
        if (e.keyCode === 123) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 'I'.charCodeAt(0) || e.keyCode === 'C'.charCodeAt(0) || e.keyCode === 'J'.charCodeAt(0))) return false;
        if (e.ctrlKey && (e.keyCode === 'U'.charCodeAt(0) || e.keyCode === 'S'.charCodeAt(0))) return false;
      };
      document.ondragstart = () => false;

      const vids = document.querySelectorAll('video[data-vid]');
      vids.forEach(v => {
        const source = v.getAttribute('data-vid');
        if (source) v.src = source;
        v.load();
      });

      /* --- CONSOLE TRAP --- */
      setInterval(() => {
        console.clear();
        console.log("%c Summon Mars Security Active", "color: red; font-size: 20px; font-weight: bold;");
      }, 2000);

      /* --- DEV TOOLS DETECTION OVERLAY --- */
      const overlay = document.createElement('div');
      overlay.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.95);color:red;display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;font-size:2rem;text-align:center;padding:2rem;';
      overlay.innerHTML = '<h1>SECURITY BREACH DETECTED</h1><p style="font-size:1.2rem;margin-top:1rem;">Summon Mars Security Active<br>Unauthorized inspection prohibited</p>';
      document.body.appendChild(overlay);

      setInterval(() => {
        const widthDiff = window.outerWidth - window.innerWidth;
        const heightDiff = window.outerHeight - window.innerHeight;
        if (widthDiff > 160 || heightDiff > 160) {
          overlay.style.display = 'flex';
          document.querySelectorAll('video').forEach(v => v.pause());
        }
      }, 500);

      /* --- VIDEO LOGIC + DYNAMIC ASPECT RATIO PRESERVATION --- */
      const wrappers = document.querySelectorAll('.video-wrapper');
      wrappers.forEach(wrapper => {
        const video = wrapper.querySelector('video');
        const playBtn = wrapper.querySelector('.btn-play');
        const muteBtn = wrapper.querySelector('.btn-mute');
        const rewindBtn = wrapper.querySelector('.btn-rewind');
        const forwardBtn = wrapper.querySelector('.btn-forward');
        const fullBtn = wrapper.querySelector('.btn-fullscreen');
        const playIconPath = playBtn?.querySelector('path');
        const muteIconPath = muteBtn?.querySelector('path');
        
        let activityTimeout;

        // On metadata load, set exact original aspect ratio (preserves "original rectangle")
        video.addEventListener('loadedmetadata', () => {
          if (video.videoWidth && video.videoHeight) {
            wrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
          }
        });

        const wake = () => {
          wrapper.classList.add('user-active');
          clearTimeout(activityTimeout);
          if (!video.paused) {
            activityTimeout = setTimeout(() => wrapper.classList.remove('user-active'), 2200);
          }
        };

        wrapper.addEventListener('click', (e) => {
          if (!e.target.closest('.control-btn')) {
            if (video.paused) {
              video.play();
              wrapper.classList.remove('paused');
              playIconPath?.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
            } else {
              video.pause();
              wrapper.classList.add('paused');
              playIconPath?.setAttribute('d', 'M8 5v14l11-7z');
            }
            wake();
          }
        });

        wrapper.addEventListener('mousemove', wake);
        wrapper.addEventListener('touchstart', wake);

        playBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (video.paused) {
            video.play();
            wrapper.classList.remove('paused');
            playIconPath?.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
          } else {
            video.pause();
            wrapper.classList.add('paused');
            playIconPath?.setAttribute('d', 'M8 5v14l11-7z');
          }
          wake();
        });

        muteBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          video.muted = !video.muted;
          muteIconPath?.setAttribute('d', video.muted 
            ? 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z'
            : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z');
          wake();
        });

        rewindBtn?.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime = Math.max(0, video.currentTime - 10); wake(); });
        forwardBtn?.addEventListener('click', (e) => { e.stopPropagation(); video.currentTime = Math.min(video.duration, video.currentTime + 10); wake(); });

        fullBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (wrapper.requestFullscreen) wrapper.requestFullscreen();
          else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
          else if (wrapper.msRequestFullscreen) wrapper.msRequestFullscreen();
          wake();
        });

        video.addEventListener('ended', () => {
          video.load();
          wrapper.classList.add('paused');
          playIconPath?.setAttribute('d', 'M8 5v14l11-7z');
        });
      });
    });
  </script>

</body>
</html>
