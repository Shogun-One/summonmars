<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Asteroid Drift - Summon Mars Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg1: #05030b;
      --bg2: #140b2a;
      --accent: #ff3b82;
      --accent-soft: #ff8ac0;
      --hud: #e4e4ff;
      --asteroid-outer: #8a2be2;
      --asteroid-inner: #ffe7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--hud);
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: var(--accent-soft);
    }

    .subtitle {
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
      max-width: 420px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 0.3rem;
    }

    .hud span {
      color: var(--accent-soft);
      font-weight: 600;
    }

    canvas {
      margin-top: 0.4rem;
      border-radius: 18px;
      background:
        radial-gradient(circle at top, #1a1638, #05020a),
        repeating-radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
      box-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 26px rgba(255, 59, 130, 0.45);
      touch-action: none; /* important for mobile drag */
      max-width: 100vw;
      height: auto;
    }

    .controls {
      font-size: 0.8rem;
      opacity: 0.85;
      text-align: center;
      margin-top: 0.3rem;
      line-height: 1.4;
    }

    .controls strong {
      color: var(--accent-soft);
    }

    .hint {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 0.2rem;
    }

    button {
      margin-top: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #05030b;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(255, 59, 130, 0.7);
    }

    button:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>ASTEROID DRIFT</h1>
    <div class="subtitle">
      Neon field. Heavy debris. You are the last signal in orbit.
    </div>

    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>

    <canvas id="game" width="480" height="640"></canvas>

    <div class="controls">
      Move with <strong>WASD</strong> or <strong>Arrow Keys</strong> •
      Fire with <strong>Space</strong> or <strong>tap</strong><br />
      On mobile: drag to move your ship, tap to blast.
      <div class="hint">Press "Reset" if things get weird or you want a clean run.</div>
      <button id="reset-btn">Reset Field</button>
    </div>
  </div>

  <script>
    // Grab elements
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const resetBtn = document.getElementById('reset-btn');

    // Neon space field size
    const width = canvas.width;
    const height = canvas.height;

    // Persistent best score
    let bestScore = Number(localStorage.getItem('asteroidBestV2') || 0);
    bestEl.textContent = bestScore;

    // Core game state
    const ship = {
      x: width / 2,
      y: height / 2,
      radius: 16,
      speed: 4.4,
      vx: 0,
      vy: 0,
    };

    const keys = {};
    let bullets = [];
    let asteroids = [];
    let score = 0;
    let running = true;
    let lastTime = 0;
    let shootCooldown = 0;
    const shootDelay = 180; // ms between shots
    const asteroidCount = 9;

    // Utility
    function randRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnAsteroid(edgeSpawn = true) {
      let x, y, angle;
      const radius = randRange(18, 40);
      if (edgeSpawn) {
        // spawn at edges
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { // top
          x = randRange(0, width);
          y = -radius;
        } else if (edge === 1) { // right
          x = width + radius;
          y = randRange(0, height);
        } else if (edge === 2) { // bottom
          x = randRange(0, width);
          y = height + radius;
        } else { // left
          x = -radius;
          y = randRange(0, height);
        }
        angle = Math.atan2(ship.y - y, ship.x - x);
      } else {
        x = randRange(0, width);
        y = randRange(0, height);
        angle = randRange(0, Math.PI * 2);
      }

      const speed = randRange(0.9, 2.2);
      asteroids.push({
        x,
        y,
        radius,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
      });
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      ship.x = width / 2;
      ship.y = height / 2;
      ship.vx = 0;
      ship.vy = 0;
      bullets = [];
      asteroids = [];
      running = true;
      shootCooldown = 0;
      for (let i = 0; i < asteroidCount; i++) {
        spawnAsteroid(false);
      }
    }

    resetBtn.addEventListener('click', resetGame);

    // Input: keyboard
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        shootRequested = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Input: touch / mouse
    let pointerActive = false;
    let pointerPos = { x: ship.x, y: ship.y };
    let shootRequested = false;
    let lastTapTime = 0;

    function setPointerFromEvent(ev) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (ev.touches && ev.touches[0]) {
        clientX = ev.touches[0].clientX;
        clientY = ev.touches[0].clientY;
      } else {
        clientX = ev.clientX;
        clientY = ev.clientY;
      }

      pointerPos.x = ((clientX - rect.left) / rect.width) * width;
      pointerPos.y = ((clientY - rect.top) / rect.height) * height;
    }

    canvas.addEventListener('mousedown', (e) => {
      pointerActive = true;
      setPointerFromEvent(e);
      shootRequested = true;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!pointerActive) return;
      setPointerFromEvent(e);
    });

    window.addEventListener('mouseup', () => {
      pointerActive = false;
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const now = performance.now();
      setPointerFromEvent(e);
      pointerActive = true;

      // quick tap = shoot
      if (now - lastTapTime < 260) {
        shootRequested = true;
      }
      lastTapTime = now;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      setPointerFromEvent(e);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      pointerActive = false;
    }, { passive: false });

    // Shooting
    function shoot() {
      const speed = 6.2;
      // aim toward nearest asteroid or straight up if none
      let angle;
      if (asteroids.length > 0) {
        let closest = asteroids[0];
        let bestDist = Infinity;
        for (const a of asteroids) {
          const dx = a.x - ship.x;
          const dy = a.y - ship.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist) {
            bestDist = d2;
            closest = a;
          }
        }
        angle = Math.atan2(closest.y - ship.y, closest.x - ship.x);
      } else {
        angle = -Math.PI / 2;
      }

      bullets.push({
        x: ship.x,
        y: ship.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1600, // ms
      });
    }

    // Main update
    function update(dt) {
      if (!running) return;

      // Movement: keyboard
      let mvx = 0;
      let mvy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) mvx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) mvx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) mvy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) mvy += 1;

      const len = Math.hypot(mvx, mvy);
      if (len > 0) {
        mvx /= len;
        mvy /= len;
      }

      // Movement: pointer drag (touch/mouse)
      if (pointerActive) {
        const dx = pointerPos.x - ship.x;
        const dy = pointerPos.y - ship.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 4) {
          mvx = dx / dist;
          mvy = dy / dist;
        }
      }

      ship.vx = mvx * ship.speed;
      ship.vy = mvy * ship.speed;

      ship.x += ship.vx;
      ship.y += ship.vy;

      // clamp inside bounds
      if (ship.x < ship.radius) ship.x = ship.radius;
      if (ship.x > width - ship.radius) ship.x = width - ship.radius;
      if (ship.y < ship.radius) ship.y = ship.radius;
      if (ship.y > height - ship.radius) ship.y = height - ship.radius;

      // Shooting cooldown
      shootCooldown -= dt;
      if (shootCooldown < 0) shootCooldown = 0;

      if (shootRequested && shootCooldown === 0) {
        shoot();
        shootRequested = false;
        shootCooldown = shootDelay;
      } else {
        shootRequested = false;
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life -= dt;
        if (
          b.life <= 0 ||
          b.x < -20 || b.x > width + 20 ||
          b.y < -20 || b.y > height + 20
        ) {
          bullets.splice(i, 1);
        }
      }

      // Update asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx;
        a.y += a.vy;

        // wrap edges
        if (a.x < -a.radius) a.x = width + a.radius;
        if (a.x > width + a.radius) a.x = -a.radius;
        if (a.y < -a.radius) a.y = height + a.radius;
        if (a.y > height + a.radius) a.y = -a.radius;
      }

      // Bullet vs asteroid collision
      outerLoop: for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist < a.radius) {
            bullets.splice(j, 1);
            asteroids.splice(i, 1);
            score += 10;
            scoreEl.textContent = score;

            if (score > bestScore) {
              bestScore = score;
              bestEl.textContent = bestScore;
              localStorage.setItem('asteroidBestV2', String(bestScore));
            }

            // spawn a fresh one at edge
            spawnAsteroid(true);
            break outerLoop;
          }
        }
      }

      // Ship vs asteroid collision
      for (const a of asteroids) {
        const dx = ship.x - a.x;
        const dy = ship.y - a.y;
        const dist = Math.hypot(dx, dy);
        if (dist < ship.radius + a.radius * 0.7) {
          running = false;
          break;
        }
      }
    }

    // Drawing
    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);

      // glowing ring
      const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, ship.radius + 8);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.25, 'rgba(255,59,130,0.9)');
      grad.addColorStop(1, 'rgba(10,0,20,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, ship.radius + 8, 0, Math.PI * 2);
      ctx.fill();

      // core triangle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(0, -ship.radius);
      ctx.lineTo(ship.radius * 0.7, ship.radius * 0.9);
      ctx.lineTo(-ship.radius * 0.7, ship.radius * 0.9);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawAsteroids() {
      for (const a of asteroids) {
        const grad = ctx.createRadialGradient(
          a.x, a.y, a.radius * 0.1,
          a.x, a.y, a.radius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, 'var(--asteroid-inner)');
        grad.addColorStop(1, 'var(--asteroid-outer)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.fill();

        // subtle cracks
        ctx.strokeStyle = 'rgba(5,0,20,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(a.x + a.radius * 0.2, a.y - a.radius * 0.2, a.radius * 0.4, 0, Math.PI * 1.6);
        ctx.stroke();
      }
    }

    function drawBullets() {
      ctx.save();
      ctx.fillStyle = '#ffe7ff';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawGameOver() {
      if (running) return;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '24px system-ui';
      ctx.fillText('Field lost.', width / 2, height / 2 - 10);
      ctx.font = '16px system-ui';
      ctx.fillText('Press "Reset" to relaunch.', width / 2, height / 2 + 18);
      ctx.restore();
    }

    // Main loop
    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = timestamp - lastTime;
      lastTime = timestamp;

      update(dt);

      ctx.clearRect(0, 0, width, height);
      drawAsteroids();
      drawBullets();
      drawShip();
      drawGameOver();

      requestAnimationFrame(loop);
    }

    // Init
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
