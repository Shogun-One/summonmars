<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TMNT - Get That Slice! - Summon Mars Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/tmnticon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#05030b;
      --bg2:#0b2a12;
      --accent:#3cff9c;
      --accent-soft:#9dffbf;
      --hud:#e4e4ff;
      --danger:#ff2a2a;
      --ink:#07060a;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Rajdhani, system-ui, sans-serif;
      background:radial-gradient(circle at top, var(--bg2), var(--bg1));
      color:var(--hud);
      overflow:hidden;
      -webkit-user-select:none;
      user-select:none;
    }

    img{ pointer-events:none; -webkit-user-drag:none; }

    #bgfx{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:0;
      pointer-events:none;
    }

    .wrapper{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:.55rem;
      padding:.85rem;
      width:min(560px, 100vw);
    }

    h1{
      margin:0;
      font-family:Orbitron, system-ui, sans-serif;
      font-size:1.55rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      text-align:center;
      color:var(--accent-soft);
      text-shadow:0 0 18px rgba(60,255,156,.22);
    }

    .hud{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      max-width:520px;
      font-size:.95rem;
      margin-top:.05rem;
      gap:.45rem;
      flex-wrap: nowrap;
    }

    .hud .pill{
      background:rgba(0,0,0,.22);
      border:1px solid rgba(157,255,191,.18);
      border-radius:999px;
      padding:.3rem .65rem;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .hud .pill b{
      font-family:Orbitron, system-ui, sans-serif;
      color:var(--accent-soft);
    }

    .game-shell{
      position:relative;
      width:100%;
      display:flex;
      justify-content:center;
      margin-top:.1rem;
    }

    canvas#game{
      border-radius:18px;
      background: radial-gradient(circle at top, rgba(26, 56, 34, 0.85), rgba(5, 2, 10, 0.95));
      box-shadow:0 0 25px rgba(0,0,0,.8), 0 0 26px rgba(60,255,156,.35);
      touch-action:none;
      width:100%;
      max-width:520px;
      height:auto;
      display:block;
      z-index:2;
    }

    .bubble-btn{
      position:absolute;
      bottom:14px;
      width:54px;
      height:54px;
      border-radius:999px;
      border:1px solid rgba(157,255,191,.45);
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.10), rgba(60,255,156,.05) 55%, rgba(0,0,0,.22));
      backdrop-filter: blur(6px);
      cursor:pointer;
      display:grid;
      place-items:center;
      z-index:10;
    }

    .difficulty-btn{ left:14px; }
    .music-btn{ right:14px; }
    
    .restart-btn{
      top: 12px;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
    }

    .dpad-btn{
      left:50%;
      transform:translateX(-50%);
      bottom:14px;
      width:88px;
      height:88px;
      background: none;
      border: none;
    }

    .dpad{ position:relative; width:100%; height:100%; }
    .dpad button{
      position:absolute;
      width:30px;
      height:30px;
      background:rgba(255,0,0,0.18);
      border:1px solid rgba(255,60,60,0.8);
      border-radius:8px;
      box-shadow:0 0 10px rgba(255,0,0,0.4);
    }
    .dpad .up{ top:0; left:29px; }
    .dpad .down{ bottom:0; left:29px; }
    .dpad .left{ left:0; top:29px; }
    .dpad .right{ right:0; top:29px; }

    #startOverlay, #gameOverOverlay {
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:rgba(0,0,0,0.6);
      z-index:15;
      border-radius:18px;
      pointer-events:none;
    }

    #startOverlay.active, #gameOverOverlay.active { display:flex; }

    .big { font-family:Orbitron; font-size:1.8rem; color:var(--accent-soft); }
    .big.red { color: var(--danger); text-shadow: 0 0 15px var(--danger); }

    #character-select-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:2000;
      padding:1rem;
    }

    .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .char-btn{
      width: 140px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: rgba(255,255,255,0.05);
      color: white;
      cursor: pointer;
    }

    .security-banner {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      font-size: 0.65rem;
      color: #ff3b3b;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 59, 59, 0.4);
      border-radius: 999px;
      z-index: 100;
    }

    footer { position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; opacity: 0.6; }
  </style>
</head>

<body>
  <canvas id="bgfx"></canvas>
  <div class="security-banner">Protected From Bad Vibes</div>

  <div class="wrapper">
    <h1>TMNT · GET THAT SLICE!</h1>
    
    <div class="hud">
      <div class="pill">Slices: <b id="score">0</b></div>
      <div class="pill">Best: <b id="best">0</b></div>
      <div class="pill">Lives: <b id="lives">3</b></div>
      <div class="pill"><b id="diffLabel">Sewer</b></div>
    </div>

    <div class="game-shell">
      <canvas id="game" width="505" height="606"></canvas>

      <div id="startOverlay">
        <p class="big">GET READY</p>
        <div class="small">Cowabunga!</div>
      </div>

      <div id="gameOverOverlay">
        <p class="big red">GAME OVER</p>
        <div class="small">Press Restart to Try Again</div>
      </div>

      <button id="difficultyBtn" class="bubble-btn difficulty-btn" title="Difficulty">
        <span class="dot" style="width:10px;height:10px;background:var(--accent);border-radius:50%"></span>
      </button>

      <button id="restartBtn" class="bubble-btn restart-btn" title="Restart">
        <div style="width:15px;height:15px;border:2px solid white;border-radius:50%;border-top-color:transparent"></div>
      </button>

      <div class="dpad-btn" id="dpadBtn">
        <div class="dpad">
          <button class="up" data-dir="up"></button>
          <button class="left" data-dir="left"></button>
          <button class="right" data-dir="right"></button>
          <button class="down" data-dir="down"></button>
        </div>
      </div>

      <button id="musicBtn" class="bubble-btn music-btn" title="Music">
        <span id="musicLabel" style="font-size:10px">OFF</span>
      </button>
    </div>

    <footer>© 2026 Summon Mars ™</footer>
  </div>

  <div id="character-select-overlay">
    <h2 style="font-family:Orbitron; color:var(--accent)">Choose Your Hero</h2>
    <div class="char-grid">
      <button class="char-btn" data-sprite="images/leo-ico.png">Leo</button>
      <button class="char-btn" data-sprite="images/raph-ico.png">Raph</button>
      <button class="char-btn" data-sprite="images/mikey-ico.png">Mikey</button>
      <button class="char-btn" data-sprite="images/Casey-Jones.png">Casey</button>
      <button class="char-btn" data-sprite="images/april-ico.png">April</button>
      <button class="char-btn" data-sprite="images/splinter-ico.png">Splinter</button>
    </div>
  </div>

  <script>
    // --- Resource Loader ---
    (function() {
      var resourceCache = {};
      var loading = [];
      var readyCallbacks = [];
      function load(urlOrArr) {
        if(Array.isArray(urlOrArr)) urlOrArr.forEach(_load);
        else _load(urlOrArr);
      }
      function _load(url) {
        if(resourceCache[url]) return;
        var img = new Image();
        img.onload = function() {
          resourceCache[url] = img;
          if(isReady()) readyCallbacks.forEach(f => f());
        };
        resourceCache[url] = false;
        img.src = url;
      }
      function get(url) { return resourceCache[url]; }
      function isReady() {
        for(var k in resourceCache) { if(resourceCache.hasOwnProperty(k) && !resourceCache[k]) return false; }
        return true;
      }
      window.Resources = { load, get, onReady: (f) => readyCallbacks.push(f), isReady };
    })();

    // --- Game Logic ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let app = { 
      running: false, 
      gameOver: false, 
      score: 0, 
      lives: 3, 
      level: 1,
      diffIdx: 0,
      offsetY: -20
    };

    const DIFFS = [
      { name: "Sewer", speed: 0.8 },
      { name: "Dojo", speed: 1.1 },
      { name: "Mutant", speed: 1.4 },
      { name: "Ninja", speed: 1.8 }
    ];

    class Enemy {
      constructor(y) {
        this.y = y;
        this.reset();
      }
      reset() {
        this.x = -(Math.random() * 500);
        this.speed = (1.5 + Math.random() * 2) * DIFFS[app.diffIdx].speed;
        const sprites = ["images/fsoldier1.png", "images/fsoldier2.png", "images/bebop.png", "images/shredder-ico.png"];
        this.sprite = sprites[Math.floor(Math.random() * sprites.length)];
      }
      update() {
        this.x += this.speed;
        if(this.x > 505) this.reset();
      }
      render() {
        let img = Resources.get(this.sprite);
        if(img) ctx.drawImage(img, this.x, this.y + app.offsetY);
      }
    }

    class Player {
      constructor() {
        this.sprite = "images/leo-ico.png";
        this.reset();
      }
      reset() { this.x = 202; this.y = 400; }
      render() {
        let img = Resources.get(this.sprite);
        if(img) ctx.drawImage(img, this.x, this.y + app.offsetY);
      }
      handleInput(dir) {
        if(!app.running || app.gameOver) return;
        if(dir === 'up') this.y -= 83;
        if(dir === 'down' && this.y < 400) this.y += 83;
        if(dir === 'left' && this.x > 0) this.x -= 101;
        if(dir === 'right' && this.x < 400) this.x += 101;
      }
    }

    class Pizza {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.floor(Math.random() * 5) * 101;
        this.y = 0;
      }
      render() {
        let img = Resources.get("images/pizza-ico.png");
        if(img) ctx.drawImage(img, this.x, this.y + app.offsetY);
      }
    }

    const player = new Player();
    const pizza = new Pizza();
    let enemies = [new Enemy(83), new Enemy(166), new Enemy(249), new Enemy(332)];

    function initGame() {
      app.score = 0;
      app.lives = 3;
      app.gameOver = false;
      document.getElementById('gameOverOverlay').classList.remove('active');
      updateHUD();
      startCountdown();
    }

    function startCountdown() {
      app.running = false;
      document.getElementById('startOverlay').classList.add('active');
      setTimeout(() => {
        app.running = true;
        document.getElementById('startOverlay').classList.remove('active');
      }, 1500);
    }

    function updateHUD() {
      document.getElementById('score').textContent = app.score;
      document.getElementById('lives').textContent = app.lives;
      document.getElementById('diffLabel').textContent = DIFFS[app.diffIdx].name;
      let best = localStorage.getItem('tmntBest') || 0;
      if(app.score > best) {
        best = app.score;
        localStorage.setItem('tmntBest', best);
      }
      document.getElementById('best').textContent = best;
    }

    function checkCollisions() {
      // Enemy hits
      enemies.forEach(e => {
        if(Math.abs(player.x - e.x) < 50 && Math.abs(player.y - e.y) < 50) {
          loseLife();
        }
      });
      // Pizza Goal
      if(player.y <= 0) {
        if(Math.abs(player.x - pizza.x) < 50) {
          app.score++;
          updateHUD();
          pizza.reset();
          player.reset();
          startCountdown();
        } else {
          // Hit water without pizza
          loseLife();
        }
      }
    }

    function loseLife() {
      app.lives--;
      updateHUD();
      player.reset();
      if(app.lives <= 0) {
        app.gameOver = true;
        app.running = false;
        document.getElementById('gameOverOverlay').classList.add('active');
      } else {
        startCountdown();
      }
    }

    function render() {
      ctx.clearRect(0,0,505,606);
      const rows = ["images/water-block.png", "images/stone-block.png", "images/stone-block.png", "images/stone-block.png", "images/stone-block.png", "images/grass-block.png"];
      for(let r=0; r<6; r++) {
        for(let c=0; c<5; c++) {
          ctx.drawImage(Resources.get(rows[r]), c*101, r*83 + app.offsetY);
        }
      }
      pizza.render();
      enemies.forEach(e => { e.update(); e.render(); });
      player.render();
      if(app.running) checkCollisions();
      requestAnimationFrame(render);
    }

    // --- Inputs ---
    document.addEventListener('keyup', e => {
      const keys = {37:'left', 38:'up', 39:'right', 40:'down', 87:'up', 65:'left', 83:'down', 68:'right'};
      if(keys[e.keyCode]) player.handleInput(keys[e.keyCode]);
    });

    document.getElementById('dpadBtn').addEventListener('click', e => {
      if(e.target.dataset.dir) player.handleInput(e.target.dataset.dir);
    });

    document.getElementById('restartBtn').addEventListener('click', initGame);
    
    document.getElementById('difficultyBtn').addEventListener('click', () => {
      app.diffIdx = (app.diffIdx + 1) % DIFFS.length;
      updateHUD();
    });

    document.querySelectorAll('.char-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        player.sprite = btn.dataset.sprite;
        document.getElementById('character-select-overlay').style.display = 'none';
        initGame();
      });
    });

    Resources.load([
      "images/water-block.png", "images/stone-block.png", "images/grass-block.png",
      "images/leo-ico.png", "images/raph-ico.png", "images/mikey-ico.png", "images/Casey-Jones.png",
      "images/april-ico.png", "images/splinter-ico.png", "images/pizza-ico.png",
      "images/fsoldier1.png", "images/fsoldier2.png", "images/bebop.png", "images/shredder-ico.png"
    ]);
    Resources.onReady(render);
  </script>
</body>
</html>
